replicaCount: 1
image:
  tag: "latest"
ingress:
  host: api-dev.acimate.com
  annotations:
    external-dns.alpha.kubernetes.io/hostname: api-dev.acimate.com
resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
config:
  LOG_LEVEL: "debug"
secrets:
  EXAMPLE_SECRET: "dev-secret"
autoscaling:
  minReplicas: 1
  maxReplicas: 3