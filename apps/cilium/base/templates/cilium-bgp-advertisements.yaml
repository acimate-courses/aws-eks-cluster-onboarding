apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: "poolCIDR" 
    - advertisementType: "service"
      service:
        addresses:
          - ClusterIP
          - ExternalIP
          - LoadBalancerIP
