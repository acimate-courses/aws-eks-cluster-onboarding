{{- if .Values.bgpControlPlane.enabled}}
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-peer
spec:
  nodeSelector:
    matchExpressions:
      - key: eks.amazonaws.com/compute-type
        operator: In
        values:
          - htbrid
  bgpInstances:
    - name: "rack0"
      localASN: {{ .Values.bgp.localASN}}
      peers:
      {{- range .Values.bgp.peers}}
        - name: {{ .name | quote}}
          peerASN: {{.peerASN}}
          peerAddress: {{.peerAddress}}
          peerConfigRef:
            name: "cilium-peer"
      {{- end}}
{{- end}}


